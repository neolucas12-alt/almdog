name: 알림dog 공지 확인

on:
  schedule:
    # 30분마다 (UTC 기준, 한국시간 무관하게 동작)
    - cron: "*/30 * * * *"
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write # seen.json 커밋용

concurrency:
  group: almdog-check
  cancel-in-progress: false
  # 겹치는 실행은 취소하지 않고 순서대로 대기시켜 push 충돌을 막는다

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests beautifulsoup4 lxml

      - name: 공지 확인 및 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: ${{ vars.KEYWORDS }}
        run: python notify.py

      - name: 상태 저장
        run: |
          git config user.name  "almdog-bot"
          git config user.email "actions@github.com"
          git add seen.json
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "chore: update seen.json [skip ci]"
          # 그 사이 원격이 앞서 있으면(수동 편집 등) 받아서 재시도
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패, 재시도 $i/5"
            git pull --rebase -X ours origin main
            sleep $((i * 3))
          done
          echo "push 최종 실패"
          exit 1
